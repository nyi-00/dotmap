<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>ドットマップ記録を開いています…</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 0; padding: 2rem 1rem; color: #1a2120; background: #f2f3ef; }
    main { max-width: 32rem; margin: 10vh auto; }
    a { color: #176b45; }
  </style>
</head>
<body>
  <main>
    <p>端末に合った画面を開いています…</p>
    <p>自動で移動しない場合：<a id="manual" href="mobile.html">スマホ版を開く</a></p>
  </main>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var isIPad = /Macintosh/i.test(ua) && navigator.maxTouchPoints > 1;
      var isMobileUA = /Android|iPhone|iPod|Mobile|Windows Phone/i.test(ua) || isIPad;
      var isSmallScreen = window.matchMedia('(max-width: 700px)').matches;
      var target = (isMobileUA || isSmallScreen) ? 'mobile.html' : 'pc.html';
      document.getElementById('manual').href = target + location.search + location.hash;
      location.replace(target + location.search + location.hash);
    })();
  </script>
</body>
</html>
